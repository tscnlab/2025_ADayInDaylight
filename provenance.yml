semantic_rules:
  - "ActTrust LIGHT is photopic illuminance and must not be treated as melanopic EDI."
  - "The public light table uses floor-aligned one-minute means; source epoch and contributing-observation counts are retained, and explicit gaps remain missing rather than zero."
  - "Event states must be ordered chronologically within participant before interval ends and durations are derived."
  - "Recorded, legacy-dashboard and author-approved corrected timestamps must remain distinguishable for corrected streams."
  - "The Malaysian correction implemented in Analysis.qmd is author-approved at -115200 seconds; retain recorded and corrected timestamps and do not assert the unverified UTC-clock rationale as device metadata."
  - "record_id is incomplete after event-state linkage and must not be the release participant key."
  - "The device serial is used internally for source linkage only; one HMAC-derived opaque participant_id links every public table."
  - "Travel clock times are interpreted in their reported start/end IANA zones and converted to UTC at one-minute precision; the unexplained legacy one-hour end-time subtraction is not applied."
privacy_rules:
  - "Do not include raw logger headers or raw REDCap exports."
  - "Remove free text, direct identifiers, device serials and device/app payloads."
  - "Retain cleaned country and coordinates rounded to one decimal place; remove city and exact coordinates."
  - "Retain exact age and sex assigned at birth under the author decision; 45 of 47 country-coordinate-age-sex profiles are unique."
  - "Remove raw flight numbers and replace them with a domain-separated HMAC identifier keyed to normalised flight number plus local departure date; never publish the key input or mapping."
  - "Exact age, sex at birth, one-decimal coordinates, exact timestamps and event sequences remain pseudonymous; their residual linkage risk was accepted through exact-archive review."
  - "Use a new opaque participant identifier with the crosswalk held outside the deposit."
release_builder:
  workflow: "The R release builder produced the four participant-linked public tables and the aggregate audit records."
  participant_output: "four participant-linked public tables built after CC BY 4.0 authority, exact-file review and confidential HMAC linkage; the released files passed 19 exact checks with zero failures and two accepted residual-risk warnings"
  public_epoch: "one-minute floor-aligned means on a complete 50-hour UTC grid"
  private_linkage: "device serial used only to locate source files and derive the shared opaque participant ID; source flight number used only to derive the opaque dated-flight ID; serial, source numbers and crosswalks are not written"
